# Keep the commit-SHA pins in .github/workflows/ up to date via PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Never propose a version published less than a week ago: most malicious
    # releases are detected and pulled within days, and a bump that waits
    # them out needs no judgment from whoever reviews it. Covers version
    # updates only; security updates are never delayed.
    cooldown:
      default-days: 7
