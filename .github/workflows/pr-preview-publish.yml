name: PR Preview Publish

# Companion to `pr-preview-build.yml`. Triggered by `workflow_run` so it
# runs in the BASE repo's privileged context (full write token, secrets
# available) even when the originating PR is from a fork — that's the
# only way to upload a release asset and post the PR comment, since
# `pull_request` runs from forks get a read-only token.
#
# Trust model: this workflow never checks out or executes the PR's
# code. It only reads `blueprint.json` from the base branch and
# consumes the already-built zip artifact from the build run. The PR
# identity (number + head SHA) is derived exclusively from the trusted
# `workflow_run` event payload — never from artifacts, because the
# build run executes fork-controlled code that can write arbitrary
# artifact contents. Do NOT add steps here that run untrusted PR code
# or that trust artifact bytes for anything beyond the zip itself.
#
# Note: this file must already exist on the default branch before the
# `workflow_run` trigger will fire — it won't run for the very first
# PR in which it's introduced.

on:
  workflow_run:
    workflows: ['PR Preview Build']
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve PR from trusted workflow_run data
        id: meta
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // PR identity is never taken from the build run's artifacts — that
            // run executes fork-controlled code and can write whatever it
            // likes, so a malicious PR could aim the preview comment at any
            // PR. Derive it from the `workflow_run` event instead: GitHub sets
            // `head_sha`, `head_repository` and `head_branch`, and PR code
            // cannot spoof any of them.
            //
            // Resolve the PR by head repo + branch. `workflow_run.pull_requests`
            // is empty for fork PRs, and so is
            // `listPullRequestsAssociatedWithCommit` — that endpoint does not
            // resolve commits living in a fork, which left every fork PR
            // without a preview.
            //
            // The `head` filter is server-side and fails open: a value GitHub
            // does not recognise is ignored rather than rejected, and the call
            // then returns every PR. Re-check owner, branch and SHA against the
            // payload below so ownership is an invariant enforced here, not a
            // bet on that filter's behaviour.
            const run = context.payload.workflow_run;
            const headSha = run.head_sha;
            if (!/^[0-9a-f]{40}$/.test(headSha)) {
              core.setFailed(`Unexpected workflow_run head SHA: ${headSha}`);
              return;
            }
            const headOwner = run.head_repository?.owner?.login;
            const headBranch = run.head_branch;
            if (!headOwner || !headBranch) {
              core.setFailed(`Incomplete workflow_run head data: owner=${headOwner} branch=${headBranch}`);
              return;
            }
            // `state: 'all'` because a PR can merge between the build finishing
            // and this run starting; the old lookup published in that window
            // and there's no reason to start failing there. A branch reused
            // across several PRs can match more than once, so prefer the open
            // one.
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              head: `${headOwner}:${headBranch}`,
              per_page: 100,
            });
            // `head.repo` is null when the head fork has been deleted.
            const matches = prs.filter(
              (p) =>
                p.head.sha === headSha &&
                p.head.repo?.owner?.login === headOwner &&
                p.head.ref === headBranch
            );
            const pr = matches.find((p) => p.state === 'open') ?? matches[0];
            if (!pr) {
              // Not a failure. The realistic causes are all benign races: a
              // push or force-push landed while the build was still running, so
              // the PR's head has moved past the commit this run built; or the
              // head fork was deleted, leaving `head.repo` null. Either way the
              // built commit is superseded and there is nothing worth
              // publishing — the newer commit's own build/publish pair posts
              // the preview, and a preview of the older code under the current
              // PR would actively mislead a reviewer.
              //
              // Skipping keeps the security property intact: a preview is still
              // only ever published to a PR positively identified from the
              // trusted payload. What it stops is a red run in the trunk
              // Actions tab (`workflow_run` runs are attributed to the default
              // branch) every time someone pushes twice in quick succession.
              // Genuine trouble still fails loudly: a malformed payload is
              // caught above, and an API or permission error throws out of
              // `paginate` rather than returning an empty list.
              core.warning(`No pull request for ${headOwner}:${headBranch} at head SHA ${headSha}; the head has moved on, skipping the preview.`);
              return;
            }
            core.setOutput('pr-number', String(pr.number));
            core.setOutput('head-sha', headSha);

      - name: Prune preview zips of closed PRs
        # The expose step below keeps 20 zips per PR, but nothing removed a
        # PR's zips once it closed, and the `ci-artifacts` release hit
        # GitHub's 1000-assets-per-release cap that way: every upload (this
        # one and trunk-build.yml's) then failed with HTTP 422. Sweep before
        # uploading so a full release frees room instead of failing.
        # Fail-open on purpose: a cleanup hiccup must never cost a preview.
        #
        # Gated on the PR number like every step below it: with no PR resolved
        # there is no current-PR number to exclude, so the sweep would treat
        # the PR being built as just another candidate.
        if: steps.meta.outputs.pr-number != ''
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CURRENT_PR: ${{ steps.meta.outputs.pr-number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentPr = Number(process.env.CURRENT_PR);
            const release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag: 'ci-artifacts' })).data;
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.id,
              per_page: 100,
            });
            // Only preview zips are candidates. trunk.zip / trunk.json and
            // anything else that does not match the pr-N-sha name stay.
            const pattern = /^pr-(\d+)-[0-9a-f]{40}\.zip$/;
            const byPr = new Map();
            for (const asset of assets) {
              const m = pattern.exec(asset.name);
              if (!m) continue;
              const number = Number(m[1]);
              if (number === currentPr) continue;
              if (!byPr.has(number)) byPr.set(number, []);
              byPr.get(number).push(asset);
            }
            // Resolve PR states in batches of aliased GraphQL lookups. Delete
            // only what is positively known to be closed or merged: an
            // unresolved number (a partial response, or a number that isn't a
            // PR) is left alone.
            const numbers = [...byPr.keys()];
            const closed = [];
            for (let i = 0; i < numbers.length; i += 50) {
              const batch = numbers.slice(i, i + 50);
              const fields = batch.map((n) => `pr${n}: pullRequest(number: ${n}) { state }`).join(' ');
              const query = `query($owner: String!, $repo: String!) { repository(owner: $owner, name: $repo) { ${fields} } }`;
              let data;
              try {
                data = await github.graphql(query, { owner, repo });
              } catch (error) {
                // A GraphqlResponseError still carries the fields that did resolve.
                data = error.data;
                if (!data?.repository) {
                  core.warning(`PR state lookup failed for a batch: ${error.message}`);
                  continue;
                }
              }
              for (const n of batch) {
                const pr = data.repository[`pr${n}`];
                if (pr && pr.state !== 'OPEN') closed.push(n);
              }
            }
            let deleted = 0;
            for (const n of closed) {
              for (const asset of byPr.get(n)) {
                try {
                  await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
                  deleted++;
                } catch (error) {
                  core.warning(`Could not delete ${asset.name}: ${error.message}`);
                }
              }
            }
            core.info(`${assets.length} assets on ci-artifacts; ${closed.length} closed PRs; deleted ${deleted} zip(s).`);

      - name: Expose built artifact on a public URL
        if: steps.meta.outputs.pr-number != ''
        id: expose
        uses: WordPress/action-wp-playground-pr-preview/.github/actions/expose-artifact-on-public-url@1b15093d61b5e98cdfeb31466f34ade495762cd7 # v4.0.0
        with:
          artifact-name: 'built-plugin'
          artifact-filename: 'openstation.zip'
          pr-number: ${{ steps.meta.outputs.pr-number }}
          commit-sha: ${{ steps.meta.outputs.head-sha }}
          artifacts-to-keep: '20'
          artifact-source-run-id: ${{ github.event.workflow_run.id }}

      - name: Build blueprint
        if: steps.meta.outputs.pr-number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: blueprint
        env:
          ARTIFACT_URL: ${{ steps.expose.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const path = '.wordpress-org/blueprints/blueprint.json';
            const blueprint = JSON.parse(fs.readFileSync(path, 'utf8'));
            const install = blueprint.steps.find((s) => s.step === 'installPlugin');
            install.pluginData.url = process.env.ARTIFACT_URL;
            return JSON.stringify(blueprint);
          result-encoding: string

      - name: Post preview to PR
        if: steps.meta.outputs.pr-number != ''
        uses: WordPress/action-wp-playground-pr-preview@1b15093d61b5e98cdfeb31466f34ade495762cd7 # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          blueprint: ${{ steps.blueprint.outputs.result }}
          pr-number: ${{ steps.meta.outputs.pr-number }}
