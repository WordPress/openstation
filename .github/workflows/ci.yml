name: CI

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

# Least privilege: this workflow only reads the repo to lint, build, and test.
# It never writes commits, comments, or releases, so the token needs no more
# than read access to repository contents.
permissions:
  contents: read

jobs:
  js:
    name: Lint · Types · Vitest
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GITHUB_TOKEN in .git/config; later steps run
          # PR-authored code (npm scripts, build) and this job never needs
          # git auth after checkout.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript (no emit)
        run: npx tsc --noEmit

      - name: Vitest
        run: npm run test:js

      - name: Popup Siege extension checks
        run: |
          npm --prefix extensions/desktop-mode-popup-siege run check
          node --test extensions/desktop-mode-popup-siege/tests/*.test.js
          git diff --exit-code -- \
            extensions/desktop-mode-popup-siege/games/popup-breaker/assets/popup-siege-runtime-0.7.0.js

      - name: SOL extension checks
        run: |
          npm --prefix extensions/desktop-mode-feed-buddy run lint
          npm --prefix extensions/desktop-mode-feed-buddy run typecheck
          npm --prefix extensions/desktop-mode-feed-buddy run test
          npm --prefix extensions/desktop-mode-feed-buddy run build
          git diff --exit-code -- extensions/desktop-mode-feed-buddy/assets/js

      - name: Electron adapter extension checks
        env:
          # Nothing in this job launches Electron — this is lint, types,
          # unit tests and the bundles. The `electron` package still
          # installs (its type definitions are what `app/tsconfig.json`
          # compiles against); only the ~100 MB binary download is
          # skipped.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm --prefix extensions/openstation-electron-adapter ci
          # The package's own `verify`, rather than a sequence spelled
          # out again here. It builds BEFORE it tests, and that order is
          # load-bearing: `connect-bundle.test.ts` asserts against
          # `app/dist/renderer/connect.js`, so a run that tests first
          # passes only on a machine that happens to have built already.
          # Deferring to `verify` also means a developer running it
          # locally is running what CI runs.
          npm --prefix extensions/openstation-electron-adapter run verify
          git diff --exit-code -- extensions/openstation-electron-adapter/assets/js

  php:
    name: PHPUnit · PHP ${{ matrix.php }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4' ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GITHUB_TOKEN in .git/config; later steps run
          # PR-authored code (npm scripts, build) and this job never needs
          # git auth after checkout.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The one piece of build output the PHP suite reads from disk:
      # `openstation_apps_client_bundle()` only reports an app's client
      # view when `assets/js/apps/<name>[.min].js` exists, and that
      # directory is gitignored like the rest of `assets/js/`. Two vite
      # runs, well under a second — cheaper than a test that asserts
      # against source instead of the artifact a user installs.
      - name: Build app client views
        run: npm run build:apps

      - name: Start wp-env (tests instance)
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
        run: npm run env:start:tests

      - name: Install PHP dev dependencies
        run: npm run test:php:install

      - name: Run PHPUnit
        run: npm run test:php

      # Errors gate; the ~800 advisory warnings still report on a local
      # `npm run lint:php:all` but never fail the build. See phpcs.xml.dist
      # for which sniffs were downgraded and why.
      - name: Check plugin coding standards
        run: npm run lint:php

      - name: Run Popup Siege registration smoke test
        run: php extensions/desktop-mode-popup-siege/tests/registration-smoke.php

      - name: Check Popup Siege coding standards
        run: |
          npx wp-env run --config=.wp-env.tests.json cli \
            --env-cwd=wp-content/plugins/desktop-mode \
            vendor/bin/phpcs \
            --standard=extensions/desktop-mode-popup-siege/phpcs.xml.dist

      - name: Run SOL extension PHPUnit
        run: |
          npx wp-env run --config=.wp-env.tests.json cli \
            --env-cwd=wp-content/plugins/desktop-mode \
            vendor/bin/phpunit --configuration tests/phpunit/phpunit.xml.dist \
            extensions/desktop-mode-feed-buddy/tests/phpunit

      - name: Check SOL extension coding standards
        run: |
          npx wp-env run --config=.wp-env.tests.json cli \
            --env-cwd=wp-content/plugins/desktop-mode \
            vendor/bin/phpcs \
            --standard=extensions/desktop-mode-feed-buddy/phpcs.xml.dist \
            extensions/desktop-mode-feed-buddy

      - name: Check OpenStation Beta coding standards
        run: |
          npx wp-env run --config=.wp-env.tests.json cli \
            --env-cwd=wp-content/plugins/desktop-mode \
            vendor/bin/phpcs \
            --standard=extensions/openstation-beta/phpcs.xml.dist \
            extensions/openstation-beta/openstation-beta.php extensions/openstation-beta/includes

  # Same suite against a network install. Multisite denies plain
  # administrators a raft of capabilities (activate_plugins,
  # update_core, edit_users, …) and swaps several user/site APIs,
  # which is exactly where multisite-only regressions hide. A job of
  # its own so it runs in parallel with the single-site suite instead
  # of doubling that job's time.
  php-multisite:
    name: PHPUnit multisite · PHP ${{ matrix.php }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4' ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build app client views
        run: npm run build:apps

      - name: Start wp-env (tests instance)
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
        run: npm run env:start:tests

      - name: Install PHP dev dependencies
        run: npm run test:php:install

      - name: Run PHPUnit (multisite)
        run: npm run test:php:multisite

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GITHUB_TOKEN in .git/config; later steps run
          # PR-authored code (npm scripts, build) and this job never needs
          # git auth after checkout.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Needs the built bundles, which the Vitest job deliberately does
      # not produce — `assets/js/*.js` is gitignored build output. The
      # check itself is the only one that can see cross-bundle state
      # splits: vitest imports both sides of a seam into one module
      # graph, so a module-level Map looks shared there however it is
      # written, while each Vite bundle actually compiles its own copy.
      # It skips when the bundles are absent, so this is where it counts.
      - name: Cross-bundle state boundary
        run: npx vitest run tests/vitest/bundle-shared-state.test.ts

      # Packages the plugin and the Popup Siege extension the way a release
      # ships them, then runs Plugin Check in its own wp-env. The factory's
      # gate (factory/checks.sh) runs the same script, so the flags and the
      # ignore list live in one place: see bin/plugin-check.sh.
      - name: Plugin Check
        run: bin/plugin-check.sh
