name: CI

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

# Least privilege: this workflow only reads the repo to lint, build, and test.
# It never writes commits, comments, or releases, so the token needs no more
# than read access to repository contents.
permissions:
  contents: read

jobs:
  js:
    name: Lint · Types · Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Don't leave the GITHUB_TOKEN in .git/config; later steps run
          # PR-authored code (npm scripts, build) and this job never needs
          # git auth after checkout.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript (no emit)
        run: npx tsc --noEmit

      - name: Vitest
        run: npm run test:js

      - name: Popup Siege extension checks
        run: |
          npm --prefix extensions/desktop-mode-popup-siege run check
          node --test extensions/desktop-mode-popup-siege/tests/*.test.js
          git diff --exit-code -- \
            extensions/desktop-mode-popup-siege/games/popup-breaker/assets/popup-siege-runtime-0.7.0.js

      - name: SOL extension checks
        run: |
          npm --prefix extensions/desktop-mode-feed-buddy run lint
          npm --prefix extensions/desktop-mode-feed-buddy run typecheck
          npm --prefix extensions/desktop-mode-feed-buddy run test
          npm --prefix extensions/desktop-mode-feed-buddy run build
          git diff --exit-code -- extensions/desktop-mode-feed-buddy/assets/js

      - name: Electron adapter extension checks
        env:
          # Nothing in this job launches Electron — this is lint, types,
          # unit tests and the bundles. The `electron` package still
          # installs (its type definitions are what `app/tsconfig.json`
          # compiles against); only the ~100 MB binary download is
          # skipped.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm --prefix extensions/openstation-electron-adapter ci
          # The package's own `verify`, rather than a sequence spelled
          # out again here. It builds BEFORE it tests, and that order is
          # load-bearing: `connect-bundle.test.ts` asserts against
          # `app/dist/renderer/connect.js`, so a run that tests first
          # passes only on a machine that happens to have built already.
          # Deferring to `verify` also means a developer running it
          # locally is running what CI runs.
          npm --prefix extensions/openstation-electron-adapter run verify
          git diff --exit-code -- extensions/openstation-electron-adapter/assets/js

  php:
    name: PHPUnit · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4' ]

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Don't leave the GITHUB_TOKEN in .git/config; later steps run
          # PR-authored code (npm scripts, build) and this job never needs
          # git auth after checkout.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start wp-env (tests instance)
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
        run: npm run env:start:tests

      - name: Install PHP dev dependencies
        run: npm run test:php:install

      - name: Run PHPUnit
        run: npm run test:php

      # Errors gate; the ~800 advisory warnings still report on a local
      # `npm run lint:php:all` but never fail the build. See phpcs.xml.dist
      # for which sniffs were downgraded and why.
      - name: Check plugin coding standards
        run: npm run lint:php

      - name: Run Popup Siege registration smoke test
        run: php extensions/desktop-mode-popup-siege/tests/registration-smoke.php

      - name: Check Popup Siege coding standards
        run: |
          npx wp-env run --config=.wp-env.tests.json cli \
            --env-cwd=wp-content/plugins/desktop-mode \
            vendor/bin/phpcs \
            --standard=extensions/desktop-mode-popup-siege/phpcs.xml.dist

      - name: Run SOL extension PHPUnit
        run: |
          npx wp-env run --config=.wp-env.tests.json cli \
            --env-cwd=wp-content/plugins/desktop-mode \
            vendor/bin/phpunit --configuration tests/phpunit/phpunit.xml.dist \
            extensions/desktop-mode-feed-buddy/tests/phpunit

      - name: Check SOL extension coding standards
        run: |
          npx wp-env run --config=.wp-env.tests.json cli \
            --env-cwd=wp-content/plugins/desktop-mode \
            vendor/bin/phpcs \
            --standard=extensions/desktop-mode-feed-buddy/phpcs.xml.dist \
            extensions/desktop-mode-feed-buddy

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Don't leave the GITHUB_TOKEN in .git/config; later steps run
          # PR-authored code (npm scripts, build) and this job never needs
          # git auth after checkout.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Needs the built bundles, which the Vitest job deliberately does
      # not produce — `assets/js/*.js` is gitignored build output. The
      # check itself is the only one that can see cross-bundle state
      # splits: vitest imports both sides of a seam into one module
      # graph, so a module-level Map looks shared there however it is
      # written, while each Vite bundle actually compiles its own copy.
      # It skips when the bundles are absent, so this is where it counts.
      - name: Cross-bundle state boundary
        run: npx vitest run tests/vitest/bundle-shared-state.test.ts

      - name: Package release zip
        run: npm run package

      - name: Unzip release into build dir
        run: unzip -q openstation.zip -d plugin-check-build

      - name: Package Popup Siege extension
        run: |
          ./bin/package-extensions.sh popup-siege-check-build desktop-mode-popup-siege
          unzip -q popup-siege-check-build/desktop-mode-popup-siege.zip \
            -d popup-siege-check-plugin

      # wordpress/plugin-check-action@v1 generates its own .wp-env.json that
      # pulls the Plugin Check plugin from a zip source. On current GitHub
      # runners that zip download hangs `wp-env start` (it exits 0 mid-flight
      # before the env is ready -- see the php job). Run Plugin Check in our own
      # wp-env instead: a dedicated config that mounts the BUILT plugin and uses
      # only the (reliable) core git source, with Plugin Check installed via
      # wp-cli.
      - name: Configure wp-env to check the built plugin
        run: |
          cat > .wp-env.plugin-check.json <<'JSON'
          {
          "core": null,
          "plugins": [],
          "mappings": {
            "wp-content/plugins/desktop-mode": "./plugin-check-build/desktop-mode",
            "wp-content/plugins/desktop-mode-popup-siege": "./popup-siege-check-plugin/desktop-mode-popup-siege"
          },
          "testsEnvironment": false
          }
          JSON

      - name: Start wp-env
        run: npx wp-env start --config .wp-env.plugin-check.json

      - name: Install Plugin Check plugin
        run: npx wp-env run --config .wp-env.plugin-check.json cli wp plugin install plugin-check --activate

      - name: Run Plugin Check
        run: |
          # --ignore-warnings: only ERROR-severity findings fail the build.
          # --ignore-codes: wp_enqueue_command_palette_assets() (WP 6.9) is called
          #   behind a function_exists() guard in includes/render/assets.php, which
          #   is the correct pattern for using a newer function while keeping the
          #   6.0 minimum. Plugin Check's static rule doesn't credit the guard, so
          #   this code is a false positive for us.
          # wp-env's spinner writes to stderr; the container command's output is
          # on stdout. Plugin Check prefixes each file's findings with a "FILE: …"
          # line, so strip those and slurp the per-file JSON arrays.
          set +e
          npx wp-env run --config .wp-env.plugin-check.json cli \
            wp plugin check desktop-mode --format=json --ignore-warnings \
            --ignore-codes=wp_function_not_compatible_with_requires_wp \
            > pc-results.json 2> pc-stderr.log
          rc=$?
          set -e
          echo "wp plugin check exit code: $rc"
          echo "::group::wp-env run stderr"; cat pc-stderr.log || true; echo "::endgroup::"
          echo "::group::Plugin Check raw stdout"; cat pc-results.json || true; echo; echo "::endgroup::"
          findings=$({ grep '^\[' pc-results.json || true; } | jq -s 'add // [] | length' 2>/dev/null || echo "PARSE_ERROR")
          if [ "$findings" = "PARSE_ERROR" ]; then
            echo "::error::Could not parse Plugin Check output (see raw stdout above)"
            exit 1
          fi
          echo "Plugin Check error findings: $findings"
          if [ "$findings" != "0" ]; then
            echo "::error::Plugin Check reported $findings error finding(s)"
            { grep '^\[' pc-results.json || true; } | jq -s -r 'add // [] | .[] | "[\(.code)] line \(.line // "?"): \(.message)"' || true
            exit 1
          fi
          echo "Plugin Check passed (no errors)."

      - name: Run Plugin Check for Popup Siege
        run: |
          set +e
          npx wp-env run --config .wp-env.plugin-check.json cli \
            wp plugin check desktop-mode-popup-siege --format=json --ignore-warnings \
            > popup-siege-pc-results.json 2> popup-siege-pc-stderr.log
          rc=$?
          set -e
          echo "wp plugin check exit code: $rc"
          echo "::group::wp-env run stderr"; cat popup-siege-pc-stderr.log || true; echo "::endgroup::"
          echo "::group::Plugin Check raw stdout"; cat popup-siege-pc-results.json || true; echo; echo "::endgroup::"
          findings=$({ grep '^\[' popup-siege-pc-results.json || true; } | jq -s 'add // [] | length' 2>/dev/null || echo "PARSE_ERROR")
          if [ "$findings" = "PARSE_ERROR" ]; then
            echo "::error::Could not parse Popup Siege Plugin Check output"
            exit 1
          fi
          echo "Popup Siege Plugin Check error findings: $findings"
          if [ "$findings" != "0" ]; then
            { grep '^\[' popup-siege-pc-results.json || true; } | jq -s -r 'add // [] | .[] | "[\(.code)] line \(.line // "?"): \(.message)"' || true
            exit 1
          fi
          echo "Popup Siege Plugin Check passed (no errors)."
