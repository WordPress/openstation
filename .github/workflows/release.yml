name: Release

# Triggered by pushing a vX.Y.Z tag. Builds the plugin zip and creates a
# GitHub Release with it attached. Use `bin/release.sh` locally to cut a
# release end-to-end (bump + commit + tag + push).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches plugin version
        run: |
          tag="${{ github.ref_name }}"
          tag="${tag#v}"
          pkg=$(node -p "require('./package.json').version")
          header=$(grep -oP '^\s*\*\s*Version:\s*\K\S+' wp-desktop-mode.php)
          constant=$(grep -oP "WPDM_VERSION',\s*'\K[^']+" wp-desktop-mode.php)
          if ! [[ "$tag" == "$pkg" && "$tag" == "$header" && "$tag" == "$constant" ]]; then
            echo "::error::Version mismatch — tag '$tag' vs package.json=$pkg header=$header WPDM_VERSION=$constant"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Package plugin zip
        run: bin/package.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          flags=()
          if [[ "$tag" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            "${flags[@]}" \
            wp-desktop-mode.zip
