name: Release

# Triggered by pushing a vX.Y.Z tag. Builds the plugin zip and creates a
# GitHub Release with it attached. Use `bin/release.sh` locally to cut a
# release end-to-end (bump + commit + tag + push).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches plugin version
        run: |
          tag="${{ github.ref_name }}"
          tag="${tag#v}"
          pkg=$(node -p "require('./package.json').version")
          header=$(grep -oP '^\s*\*\s*Version:\s*\K\S+' desktop-mode.php)
          constant=$(grep -oP "DESKTOP_MODE_VERSION',\s*'\K[^']+" desktop-mode.php)
          stable=$(grep -oP '^Stable tag:\s*\K\S+' readme.txt)
          if ! [[ "$tag" == "$pkg" && "$tag" == "$header" && "$tag" == "$constant" && "$tag" == "$stable" ]]; then
            echo "::error::Version mismatch — tag '$tag' vs package.json=$pkg header=$header DESKTOP_MODE_VERSION=$constant readme.txt Stable tag=$stable"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Package plugin zip
        run: bin/package.sh

      # Build one zip per extension under extensions/ and a resolved
      # manifest pointing at this tag's release assets. Both are
      # uploaded alongside the main plugin zip so the in-app
      # marketplace can fetch them from
      # `releases/latest/download/extensions.resolved.json` and
      # `releases/latest/download/<slug>.zip`.
      - name: Package extensions
        run: bin/package-extensions.sh

      - name: Build extensions manifest
        run: bin/build-manifest.sh "${{ github.ref_name }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          flags=()
          if [[ "$tag" == *-* ]]; then
            flags+=(--prerelease)
          fi
          shopt -s nullglob
          extension_zips=( dist/*.zip )
          shopt -u nullglob
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            "${flags[@]}" \
            desktop-mode.zip \
            "${extension_zips[@]}" \
            dist/extensions.resolved.json
