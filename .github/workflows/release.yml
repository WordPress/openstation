name: Release

# Triggered by pushing a vX.Y.Z tag. Builds the plugin zip and creates a
# GitHub Release with it attached. Use `bin/release.sh` locally to cut a
# release end-to-end (bump + commit + tag + push).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches plugin version
        run: |
          tag="${{ github.ref_name }}"
          tag="${tag#v}"
          pkg=$(node -p "require('./package.json').version")
          header=$(grep -oP '^\s*\*\s*Version:\s*\K\S+' desktop-mode.php)
          constant=$(grep -oP "DESKTOP_MODE_VERSION',\s*'\K[^']+" desktop-mode.php)
          stable=$(grep -oP '^Stable tag:\s*\K\S+' readme.txt)
          if ! [[ "$tag" == "$pkg" && "$tag" == "$header" && "$tag" == "$constant" && "$tag" == "$stable" ]]; then
            echo "::error::Version mismatch — tag '$tag' vs package.json=$pkg header=$header DESKTOP_MODE_VERSION=$constant readme.txt Stable tag=$stable"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Package plugin zip
        run: bin/package.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          flags=()
          if [[ "$tag" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            "${flags[@]}" \
            desktop-mode.zip

      - name: Unpack zip for wp.org deploy
        if: ${{ !contains(github.ref_name, '-') }}
        run: unzip -q desktop-mode.zip -d build/

      - name: Deploy to WordPress.org
        if: ${{ !contains(github.ref_name, '-') }}
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          BUILD_DIR: ./build/desktop-mode
