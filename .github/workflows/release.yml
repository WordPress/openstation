name: Release

# Triggered by pushing a vX.Y.Z tag. Builds the plugin zip, creates a GitHub
# Release with it attached, then deploys stable tags to WordPress.org. Use
# `bin/release.sh` locally to cut a release end-to-end (bump + commit + tag
# + push).
#
# Also runnable manually against an already-published tag, which re-attempts
# the WordPress.org deploy and leaves the GitHub Release untouched:
#
#     gh workflow run release.yml --ref trunk -f tag=v1.0.0
#
# That exists because a tag push runs the workflow definition frozen into
# that tag's commit, so a deploy that fails for a workflow-level reason can
# never be fixed by re-running it. Dispatching from trunk runs the current
# definition instead.
#
# Trust model: the build is the job most likely to execute something hostile
# (every dependency and build tool runs there), so it holds no publishing
# credential at all: a read-only token and no secrets. Each publishing job
# holds exactly one credential, consumes the build's zips as an artifact and
# runs no project code. The SVN credentials are only requested by the
# `wordpress-org` environment job, so protection rules set on that
# environment (required reviewers, a `v*` tag policy) gate the deploy.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published tag to deploy to WordPress.org (e.g. v1.0.0)'
        required: true
        type: string

# Deny by default; each job grants what it needs.
permissions: {}

jobs:
  build:
    name: Build release zips
    runs-on: ubuntu-26.04
    permissions:
      contents: read # check out the tag
    # A release builds from a clean slate. Enforced by the cache service, so
    # a setup-* action added later cannot restore a poisoned cache entry here.
    cache-mode: none
    env:
      # The tag being released: the pushed ref, or the dispatch input.
      # Consumed as a shell variable rather than interpolated into `run:`
      # bodies, so the dispatch input can't inject into the script.
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          # Nothing in this job needs git auth after checkout, and the build
          # runs dependency code.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches plugin version
        id: verify
        run: |
          tag="${TAG#v}"
          pkg=$(node -p "require('./package.json').version")
          header=$(grep -oP '^\s*\*\s*Version:\s*\K\S+' desktop-mode.php)
          constant=$(grep -oP "OPENSTATION_VERSION',\s*'\K[^']+" desktop-mode.php)
          stable=$(grep -oP '^Stable tag:\s*\K\S+' readme.txt)
          if ! [[ "$tag" == "$pkg" && "$tag" == "$header" && "$tag" == "$constant" && "$tag" == "$stable" ]]; then
            echo "::error::Version mismatch — tag '$tag' vs package.json=$pkg header=$header OPENSTATION_VERSION=$constant readme.txt Stable tag=$stable"
            exit 1
          fi
          # The deploy action derives VERSION from GITHUB_REF, which is only a
          # tag ref on a tag push — on a dispatch it resolves to the branch ref
          # and the SVN tag copy becomes `tags/refs/heads/trunk`. Hand the
          # deploy the version that was just checked against all four
          # locations, so it uses a verified value however the workflow was
          # triggered.
          {
            echo "tag=$TAG"
            echo "version=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Package plugin zip
        run: bin/package.sh

      - name: Package OpenStation Beta companion zip
        run: bin/package-beta.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-zips
          path: |
            openstation.zip
            openstation-beta.zip
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: build
    # Skipped on a manual dispatch: the Release already exists, and
    # `gh release create` is not idempotent.
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: write # create the Release and attach the zips
    cache-mode: none
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-zips

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            "${flags[@]}" \
            openstation.zip openstation-beta.zip

  wordpress-org:
    name: Deploy to WordPress.org
    needs: [ build, github-release ]
    # Stable tags only. Runs after the GitHub Release on a tag push, and on
    # its own on a dispatch, where that job is skipped.
    if: >-
      !cancelled() &&
      needs.build.result == 'success' &&
      (needs.github-release.result == 'success' || needs.github-release.result == 'skipped') &&
      !contains(needs.build.outputs.version, '-')
    runs-on: ubuntu-26.04
    environment:
      name: wordpress-org
      url: https://wordpress.org/plugins/desktop-mode/
    permissions:
      contents: read # fetch the listing assets
    cache-mode: none
    steps:
      # Only the wp.org listing assets (banners, icons, screenshots, the
      # Playground blueprint), which the deploy action syncs from the
      # workspace. Data, not code: nothing from the checkout is executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.tag }}
          persist-credentials: false
          sparse-checkout: .wordpress-org

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-zips

      - name: Unpack zip for wp.org deploy
        run: unzip -q openstation.zip -d build/

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          # The wp.org slug is frozen at `desktop-mode` (see AGENTS.md) — it is
          # the published plugin's SVN path and install directory, and renaming
          # it would orphan every existing install's update check. Set it
          # explicitly: the action otherwise defaults SLUG to the GitHub repo
          # name, which used to coincide with the wp.org slug and stopped
          # doing so when this repo was renamed to `openstation`.
          SLUG: desktop-mode
          BUILD_DIR: ./build/desktop-mode
          # Both VERSION and SLUG default off a GitHub context that is only
          # correct for a tag push, so neither is left implicit. VERSION is
          # the string the build job verified against all four locations.
          VERSION: ${{ needs.build.outputs.version }}
