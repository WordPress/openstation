name: PR Preview Build

# Builds the plugin zip for a PR and uploads it as the `built-plugin`
# artifact. This workflow is fork-safe: it runs with the read-only
# token GitHub gives `pull_request` runs from forks, so it MUST NOT
# need any write permissions or secrets. The companion
# `pr-preview-publish.yml` workflow consumes the zip via `workflow_run`
# and does the release upload + PR comment in the base repo's
# privileged context. It derives the PR identity (number + head SHA)
# from the trusted `workflow_run` event payload, NOT from any artifact
# this fork-controlled run produces — so we intentionally do not emit
# PR metadata here.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Build
        run: |
          npm ci
          npm run build
          npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: built-plugin
          path: openstation.zip
