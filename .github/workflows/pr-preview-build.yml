name: PR Preview Build

# Builds the plugin zip for a PR and uploads it as the `built-plugin`
# artifact. This workflow is fork-safe: it runs with the read-only
# token GitHub gives `pull_request` runs from forks, so it MUST NOT
# need any write permissions or secrets. The companion
# `pr-preview-publish.yml` workflow consumes the zip via `workflow_run`
# and does the release upload + PR comment in the base repo's
# privileged context. It derives the PR identity (number + head SHA)
# from the trusted `workflow_run` event payload, NOT from any artifact
# this fork-controlled run produces — so we intentionally do not emit
# PR metadata here.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GITHUB_TOKEN in .git/config; later steps run
          # PR-authored code (npm scripts, build) and this job never needs
          # git auth after checkout.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Build
        run: |
          npm ci
          npm run build
          npm run package

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-plugin
          path: openstation.zip
